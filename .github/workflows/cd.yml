# Workflow de Integração Contínua (CI)
# Objetivo: executar os testes unitários da aplicação a cada push na branch main.
# Estrutura preparada para futuras expansões, mantendo um único job.

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: livia-anjos

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Obtém o código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # Executa os testes unitários
      - name: Run unit tests
        run: yarn test
  
  build-and-deploy:
    name: Build $ Deploy Vercel Peview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
    
    steps:
      # Obtém o código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # Obter as configurações do vercel
      - name: Pull Vercel Config
        run: |
          yarn vercel pull --yes \
          --environment=preview \
          --token=$VERCEL_TOKEN

      # Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # Deploy preview no vercel
      - name: Deploy preview
        id: deploy
        run: |
          URL=$(yarn  --silent vercel deploy --prebuilt \
          --target=preview \
          --token=$VERCEL_TOKEN)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    
    steps:
      # 1. Fas checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configura ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Instalação do Chromium
      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium

      # 6. Execução dos testes de Regressão
      - name: Run E2E Regression Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment_url }}

      # 7. Relatório de testes automatizados
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

  promote:
    name: Promote to Production
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    
    steps:
      - name: Vercel Promote
        run: |
          yarn vercel promote ${{ needs.build-and-deploy.outputs.deployment_url }} \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE \
          --yes