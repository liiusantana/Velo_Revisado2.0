# Workflow de Integração Contínua (CI)
# Objetivo: executar os testes unitários da aplicação a cada push na branch main.
# Estrutura preparada para futuras expansões, mantendo um único job.

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: livia-anjos
  TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run unit tests
        run: yarn test

  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Configure Vercel Project
        run: |
          mkdir -p .vercel
          echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json

      - name: Pull Vercel Config
        run: |
          yarn vercel pull --yes \
            --environment=preview \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_SCOPE"

      - name: Build Vercel
        run: |
          yarn vercel build \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_SCOPE"

      - name: Deploy Preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt \
            --target=preview \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_SCOPE")
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium

      - name: Run E2E Regression Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment_url }}
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

  promote:
    name: Promote to Production
    needs: [build-and-deploy, e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Vercel Promote
        run: |
          npx vercel@latest promote "${{ needs.build-and-deploy.outputs.deployment_url }}" \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_SCOPE" \
            --yes
